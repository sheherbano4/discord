<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Positions</title>
    <style>
      .blue {
        width: 25%;
        height: 100px;
        background-color: blue;
        position: relative;
        top: 30px;
        left: 6%;
        border-radius: 5px;
      }
      .green {
        width: 25%;
        height: 100px;
        background-color: green;
        position: relative;
        top: -70px;
        left: 66%;
        border-radius: 5px;
      }
      .purple {
        width: 25%;
        height: 100px;
        background-color: purple;
        position: relative;
        top: 30px;
        left: 33%;
        border-radius: 5px;
      }
      .red {
        width: 25%;
        height: 100px;
        background-color: red;
        position: relative;
        top: 150px;
        left: 6%;
        border-radius: 5px;
      }
      .orange {
        width: 25%;
        height: 100px;
        background-color: orange;
        position: relative;
        top: 52px;
        left: 66%;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="blue"></div>
      <div class="green"></div>
      <div class="purple"></div>
      <div class="red"></div>
      <div class="orange"></div>
    </div>
  </body>
</html>
