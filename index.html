<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>adflexbox</title>

    <style>
      body{
        margin: 0;
        padding: 0;
      }
      .one {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        margin-top: 17px;
        margin-left: 17px;
        margin-right: 17px;
      }

      .two {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        margin: 17px;
      }
      .three {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
       margin-top:117px;
        margin-left: 17px;
        margin-right: 17px;
      }

      .blue {
        width: 12%;
        height: 85px;
        background-color: blue;
        border-radius: 5px;
      }

      .green {
        width: 12%;
        height: 85px;
        background-color: green;
        border-radius: 5px;
      }

      .purple {
        width: 12%;
        height: 85px;
        background-color: purple;
        border-radius: 5px;
        align-self: center;
        margin-top: 98px;
      }

      .red {
        width: 12%;
        height: 85px;
        background-color: red;
        border-radius: 5px;
      }

      .orange {
        width: 12%;
        height: 85px;
        background-color: orange;
        border-radius: 5px;
      }
      .yellow {
        width: 12%;
        height: 85px;
        background-color: yellow;
        border-radius: 5px;
        margin-bottom: 17px;
      }
      .aqua{
         width: 12%;
        height: 85px;
        background-color: aqua;
        border-radius: 5px;
        align-self: center;
        margin-top: -216px;
      }
      .brown {
        width: 12%;
        height: 85px;
        background-color: brown;
        border-radius: 5px;
      }
    </style>
  </head>

  <body>
    <div class="one">
      <div class="blue"></div>
      <div class="purple"></div>
      <div class="green"></div>
    </div>

    <div class="two">
      <div class="red"></div>
      <div class="orange"></div>
    </div>
    <div class="three">
        <div class="yellow"></div>
        <div class="aqua"></div>
      <div class="brown"></div>
    </div>
  </body>
</html>
